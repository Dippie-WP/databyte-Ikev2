[Service]
# Override workers: single worker so PTB ConversationHandler state survives
# across webhook calls. Multi-worker gunicorn fragments PTB in-memory
# DictPersistence across workers -- each worker has its own
# app.state.bot_application instance with its own _conversations dict, so
# a 6-step /create flow that lands on different workers between updates
# loses state and ConversationHandler never advances.
#
# Trade-off: throughput drops 4x -> 1x. OK for current admin-only load.
# Proper fix is PicklePersistence or a custom PTB persistence backend
# (PicklePersistence to a shared file, or MariaDB-backed persistence
# via bot_persistence.MariaDBPersistence) -- tracked separately.
#
# systemd syntax: ExecStart in a drop-in REPLACES the main unit's ExecStart.
# Must explicitly clear with an empty ExecStart= before the new value,
# otherwise systemd errors with "Service has more than one ExecStart=
# setting".
ExecStart=
ExecStart=/opt/vpn-portal/.venv/bin/gunicorn app:app \
  --worker-class uvicorn.workers.UvicornWorker \
  --workers 1 \
  --bind unix:/run/vpn-portal/gunicorn.sock \
  --timeout 120 \
  --graceful-timeout 30 \
  --max-requests 1000 \
  --max-requests-jitter 50 \
  --access-logfile - \
  --error-logfile -
