[Service]
# Override workers: single worker so PTB ConversationHandler state survives
# across webhook calls. Multi-worker gunicorn fragments PTB in-memory
# conversation state per-worker (each worker has its own app.state.bot_application
# instance and its own DictPersistence dict), so a 6-step /create flow that
# lands on different workers between updates loses state and handlers_fired=0.
#
# Trade-off: throughput drops 4x -> 1x. OK for current load (portal is
# admin-only, not user-facing). Proper fix is MariaDB-backed persistence
# (PicklePersistence to a shared table) — tracked separately.
ExecStart=/opt/vpn-portal/.venv/bin/gunicorn app:app \
  --worker-class uvicorn.workers.UvicornWorker \
  --workers 1 \
  --bind unix:/run/vpn-portal/gunicorn.sock \
  --timeout 120 \
  --graceful-timeout 30 \
  --max-requests 1000 \
  --max-requests-jitter 50 \
  --access-logfile - \
  --error-logfile -
