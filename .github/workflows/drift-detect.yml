name: drift-detect

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 5 minutes — catches drift from manual LIVE edits fast.
    # 5min cron is fine for a single SSH + md5sum per file (low load).
    # Combined with the push trigger (instant), the silent-detection
    # window is now ~5min instead of the prior 6h. See CONTRIBUTING.md
    # for the "no LIVE-only edits" policy this guard supports.
    - cron: "*/5 * * * *"

# Cancel previous runs on new push
concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-detect:
    name: LIVE vs git HEAD drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Note: requires `secrets.VPSSSH` (private key authorized on VPS).
      # Until configured, drift-detect fails with:
      #   "The ssh-private-key argument is empty..."
      # That is expected. Add the secret at:
      #   https://github.com/Dippie-WP/databyte-Ikev2/settings/secrets/actions
      - name: Set up SSH to VPS
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPSSSH }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # Pre-flight SSH check: fail fast (<15s) with a clear error if VPSSSH is stale/wrong
      # or the runner->VPS path is down. Saves the 56s silent timeout that would
      # otherwise be the only signal. (Added 2026-10-15 after VPSSSH key rotation;
      # see TKT for the fail2ban/IPBan investigation that motivated this.)
      - name: Pre-flight SSH check
        env:
          VPS_HOST: ${{ vars.VPS_HOST || 'vpn-prod-01' }}
          VPS_USER: ${{ vars.VPS_USER || 'root' }}
        run: |
          timeout 10 ssh -o BatchMode=yes -o ConnectTimeout=5 \
            "$VPS_USER@$VPS_HOST" 'echo "SSH pre-flight OK"' \
          || (echo "::error::SSH pre-flight failed — check VPSSSH secret matches a public key in /root/.ssh/authorized_keys on the VPS, and that the runner→VPS SSH path is reachable."; exit 1)

      - name: Run drift detector
        env:
          VPS_HOST: ${{ vars.VPS_HOST || 'vpn-prod-01' }}
          VPS_USER: ${{ vars.VPS_USER || 'root' }}
        run: |
          ./tools/ci-drift-detect.sh
